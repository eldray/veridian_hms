<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Veridian HMS</title>
  <style>
    :root { --bg:#f4f6f8; --card:#fff; --text:#1f2933; --muted:#616e7c; --border:#cbd2d9; --accent:#0e7490; --err:#b42318; }
    @media (prefers-color-scheme: dark) { :root { --bg:#111827; --card:#1f2937; --text:#f3f4f6; --muted:#9ca3af; --border:#374151; --accent:#22a6c4; --err:#f97066; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text); font-family:'Segoe UI', system-ui, sans-serif; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:32px 36px; width:min(620px, 92vw); text-align:center; }
    h1 { margin:0 0 6px; font-size:22px; }
    p { margin:0; color:var(--muted); line-height:1.5; }
    .spinner { width:38px; height:38px; margin:0 auto 18px; border:4px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    pre { text-align:left; white-space:pre-wrap; word-break:break-word; background:rgba(180,35,24,.08); border-left:4px solid var(--err); padding:12px 14px; border-radius:6px; margin:16px 0 0; font-size:13px; max-height:260px; overflow:auto; color:var(--text); }
    .buttons { display:flex; gap:10px; justify-content:center; margin-top:20px; flex-wrap:wrap; }
    button { padding:9px 16px; border-radius:6px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:14px; cursor:pointer; }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="card">
    <div id="starting">
      <div class="spinner"></div>
      <h1>Veridian HMS</h1>
      <p id="startMsg">Starting...</p>
    </div>
    <div id="error" class="hidden">
      <h1>Veridian HMS could not start</h1>
      <p>Check that PostgreSQL is running and that the database settings are correct.</p>
      <pre id="errMsg"></pre>
      <div class="buttons">
        <button class="primary" id="retry">Try again</button>
        <button id="settings">Database settings</button>
        <button id="logs">Open log folder</button>
      </div>
    </div>
  </div>
<script>
  const params = new URLSearchParams(location.search);
  const state = params.get('state');
  const msg = params.get('msg') || '';
  const api = window.electronAPI || {};
  if (state === 'error') {
    document.getElementById('starting').classList.add('hidden');
    document.getElementById('error').classList.remove('hidden');
    document.getElementById('errMsg').textContent = msg;
  } else {
    document.getElementById('startMsg').textContent = msg || 'Starting...';
  }
  document.getElementById('retry').onclick = () => api.retryStartup && api.retryStartup();
  document.getElementById('settings').onclick = () => api.openDatabaseSettings && api.openDatabaseSettings();
  document.getElementById('logs').onclick = () => api.openLogs && api.openLogs();
</script>
</body>
</html>
