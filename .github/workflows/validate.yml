name: Validate HMS

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            shared:
              - '.github/**'
              - 'prisma/**'
              - 'packages/**'
              - 'shared/**'
              - 'types/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'SECURITY.md'


  dependency-audit:
    name: Dependency vulnerability report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit root and Electron dependencies
        run: |
          npm ci --ignore-scripts
          npm audit --json > root-npm-audit.json || true
      - name: Audit backend dependencies
        working-directory: backend
        run: |
          npm ci --ignore-scripts
          npm audit --json > ../backend-npm-audit.json || true
      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm audit --json > ../frontend-npm-audit.json || true
      - name: Summarise audit findings
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const file of ['root-npm-audit.json', 'backend-npm-audit.json', 'frontend-npm-audit.json']) {
            if (!fs.existsSync(file)) {
              console.log(`\n${file}: report was not generated`);
              continue;
            }
            try {
              const report = JSON.parse(fs.readFileSync(file, 'utf8'));
              const counts = report.metadata?.vulnerabilities ?? {};
              console.log(`\n${file}: ${JSON.stringify(counts)}`);
              for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
                const via = (item.via ?? []).map(entry => typeof entry === 'string' ? entry : entry.title).filter(Boolean);
                console.log(`- ${item.severity}: ${name}; direct=${item.isDirect}; range=${item.range}; fix=${JSON.stringify(item.fixAvailable)}; advisories=${via.join('; ')}`);
              }
            } catch (error) {
              console.log(`\n${file}: could not parse report: ${error.message}`);
            }
          }
          NODE
      - name: Upload full audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-reports
          path: '*-npm-audit.json'
          if-no-files-found: warn
          retention-days: 14

  backend:
    name: Backend schema, tests and TypeScript build
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/veridian_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run backend tests
        run: npm test
      - name: Build backend
        run: npm run build

  frontend:
    name: Frontend production build
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check frontend (advisory until the existing baseline is clean)
        run: npm run typecheck
        continue-on-error: true
      - name: Build frontend
        run: npm run build

  database:
    name: PostgreSQL integration
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veridian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/veridian_test
      RUN_DB_TESTS: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Create the schema
        run: npx prisma db push --force-reset --skip-generate
      - name: Run database integration tests
        run: npm run test:integration

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        # A detected secret must fail validation and block merging.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
